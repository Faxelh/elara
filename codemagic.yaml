# Configuration Codemagic pour Elara
# - "elara-verification" : fonctionne SANS compte Apple. Vérifie que l'app compile.
# - "elara-testflight"   : à utiliser quand le compte Apple Developer sera actif.

workflows:
  elara-verification:
    name: Elara – Vérification (sans compte Apple)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Générer le projet Xcode
        script: |
          brew install xcodegen
          pip3 install --quiet pillow || pip3 install --quiet --break-system-packages pillow
          python3 scripts/icone.py
          xcodegen generate
      - name: Compiler pour le simulateur iPhone
        script: |
          set -o pipefail
          xcodebuild build \
            -project Elara.xcodeproj \
            -scheme Elara \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  elara-testflight:
    name: Elara – Envoi sur TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Elara ASC   # nom de la clé API App Store Connect ajoutée dans Codemagic
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kounandi.elara
    scripts:
      - name: Générer le projet Xcode
        script: |
          brew install xcodegen
          pip3 install --quiet pillow || pip3 install --quiet --break-system-packages pillow
          python3 scripts/icone.py
          xcodegen generate
      - name: Configurer la signature
        script: xcode-project use-profiles
      - name: Numéro de build
        script: agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Construire l'IPA
        script: xcode-project build-ipa --project Elara.xcodeproj --scheme Elara
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  elara-ipa:
    name: Elara – IPA non signé (Sideloadly / 3uTools)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Générer le projet Xcode
        script: |
          brew install xcodegen
          pip3 install --quiet pillow || pip3 install --quiet --break-system-packages pillow
          python3 scripts/icone.py
          xcodegen generate
      - name: Compiler pour iPhone (sans signature)
        script: |
          set -o pipefail
          xcodebuild build \
            -project Elara.xcodeproj \
            -scheme Elara \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Créer Elara.ipa
        script: |
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R build/derived/Build/Products/Release-iphoneos/Elara.app build/ipa/Payload/
          cd build/ipa && zip -qry Elara.ipa Payload
          ls -lh Elara.ipa
    artifacts:
      - build/ipa/Elara.ipa
