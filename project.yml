name: Elara
options:
  bundleIdPrefix: com.kounandi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_LANGUAGE: fr

targets:
  Elara:
    type: application
    platform: iOS
    sources:
      - path: Elara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kounandi.elara
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Elara/Info.plist
      properties:
        CFBundleDisplayName: Elara
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Elara utilise Face ID pour protéger votre dossier privé.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
