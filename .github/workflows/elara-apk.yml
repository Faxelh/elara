name: Elara – APK Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "NOM"
      - "Elara/Nouveautes.txt"
      - ".github/workflows/elara-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

# Si une nouvelle compilation démarre, l'ancienne s'arrête (évite les doublons).
concurrency:
  group: elara-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version affichée : Année.Mois.N → 2026.10.1, 2026.10.2… puis 2026.11.1 le mois suivant.
      - name: Calculer la version
        run: |
          # Version automatique : Année.Mois.N (N = numéro de la mise à jour dans le mois, à partir de 1).
          ANNEE=$(date -u +%Y)
          MOIS=$((10#$(date -u +%m)))
          DEBUT=$(date -u +%Y-%m-01T00:00:00Z)
          N=$(git -C "$GITHUB_WORKSPACE" rev-list --count --since="$DEBUT" HEAD)
          [ "$N" -lt 1 ] && N=1
          BASE="$ANNEE.$MOIS"
          echo "ELARA_VERSION=$BASE.$N" >> "$GITHUB_ENV"
          # Numéro de compilation : minutes écoulées depuis 1970. Il augmente toujours,
          # même si le dépôt est recréé (sinon Elara croit être déjà à jour).
          echo "ELARA_BUILD=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_ENV"
          echo "Version : $BASE.$N"
          # Nom affiché sous l'icône : contenu du fichier NOM (modifiable sur GitHub à tout moment).
          NOM=$(head -n 1 "$GITHUB_WORKSPACE/NOM" 2>/dev/null | tr -d '\r' | sed 's/^ *//;s/ *$//')
          [ -z "$NOM" ] && NOM="Elara"
          echo "ELARA_NOM=$NOM" >> "$GITHUB_ENV"
          echo "Nom : $NOM"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Nouveautés dans l'app
        run: cp ../Elara/Nouveautes.txt app/src/main/assets/nouveautes.txt

      - name: Compiler l'APK
        # Version « release » : bien plus fluide que « debug » (même signature, mise à jour par-dessus).
        run: gradle :app:assembleRelease --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk Elara.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Elara-apk
          path: android/Elara.apk
          if-no-files-found: error

      # Publie l'APK dans « Releases » : Elara le trouve et propose la mise à jour toute seule.
      - name: Publier la mise à jour
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk 'BEGIN{n=0} /^# /{n++} n==1' ../Elara/Nouveautes.txt | sed '1d' > notes.txt
          [ -s notes.txt ] || git log -1 --pretty=%s > notes.txt
          if gh release view "android-$ELARA_BUILD" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "La version android-$ELARA_BUILD est déjà publiée."
            exit 0
          fi
          gh release create "android-$ELARA_BUILD" Elara.apk \
            --repo "${{ github.repository }}" \
            --title "Elara Android $ELARA_VERSION" \
            --notes-file notes.txt \
            --target "${{ github.sha }}"
          # On garde seulement les 5 dernières versions Android.
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName -q '.[].tagName' \
            | grep '^android-' | sort -t- -k2 -n -r | tail -n +6 \
            | xargs -r -I{} gh release delete {} --repo "${{ github.repository }}" --yes --cleanup-tag

